[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langsys-fastapi"
version = "0.1.0"
description = "FastAPI integration for Langsys — a thin wrapper over the langsys Python SDK: request-locale middleware, a t() helper, and dependency-injection access."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Langsys" }]
keywords = ["langsys", "fastapi", "starlette", "i18n", "localization", "translation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "langsys>=0.1.0",
    "starlette>=0.27",
]

[project.urls]
Homepage = "https://langsys.dev"
Documentation = "https://docs.langsys.dev"
Repository = "https://github.com/langsys/langsys-fastapi"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-httpx>=0.30",
    "fastapi>=0.100",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langsys_fastapi"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
